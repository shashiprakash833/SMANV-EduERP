version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smanv_eduerp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smanv_eduerp_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smanv_eduerp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: smanv_eduerp_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/static
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - USE_SQLITE_FALLBACK=False
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
  static_volume:
